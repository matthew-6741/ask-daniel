name: Add Cookies Policy footer link

on:
  push:
    paths:
      - '.github/workflows/add-cookies-link.yml'

permissions:
  contents: write

jobs:
  update-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Cookies Policy link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''      <a href="/privacy.html">Privacy &amp; AI disclosure</a>\n      <span>·</span>\n      <a href="/login.html">Sign in</a>'''
          new = '''      <a href="/privacy.html">Privacy &amp; AI disclosure</a>\n      <span>·</span>\n      <a href="/cookies.html">Cookies Policy</a>\n      <span>·</span>\n      <a href="/login.html">Sign in</a>'''
          if old not in s:
              raise SystemExit('Expected footer block not found; refusing to modify index.html')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/add-cookies-link.yml
          git add index.html .github/workflows/add-cookies-link.yml
          git commit -m "Add Cookies Policy to homepage footer"
          git push
