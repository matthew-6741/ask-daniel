name: Clean remaining homepage AI copy

on:
  push:
    paths:
      - '.github/workflows/clean-photo-copy.yml'

permissions:
  contents: write

jobs:
  clean-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace remaining public photo copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'The AI will read this along with your description.'
          new = 'Danny will read this along with your description.'
          if old not in s:
              raise SystemExit('Expected photo hint not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/clean-photo-copy.yml
          git add index.html .github/workflows/clean-photo-copy.yml
          git commit -m "Use Ask Danny voice in photo helper copy"
          git push
