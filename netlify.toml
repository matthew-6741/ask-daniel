# Where the serverless functions live. Netlify infers this on Git-connected
# builds, but a drag-and-drop deploy needs it stated explicitly — without it
# /api/ai falls through to the 404 page.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking / iframe embedding
    X-Frame-Options = "DENY"

    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"

    # Only send referrer to same origin
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Force HTTPS for 1 year, include subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # OWASP now says to turn this off, not on: the legacy XSS auditor could be
    # abused to introduce vulnerabilities into otherwise safe pages, and every
    # browser that had it has removed it. CSP is the real protection.
    X-XSS-Protection = "0"

    # Isolate the browsing context — the mitigation for Spectre-class and
    # XS-Leak attacks. "allow-popups" rather than plain "same-origin" because
    # Firebase's Google sign-in opens a popup that must postMessage back to its
    # opener; plain same-origin severs that and the sign-in silently hangs.
    # Firebase is not configured yet, so this would have broken later, in a
    # place nobody would have connected to a header change.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

    # Our own responses may only be loaded by our own site.
    Cross-Origin-Resource-Policy = "same-site"

    # Deliberately NOT setting Cross-Origin-Embedder-Policy: require-corp.
    # It blocks every cross-origin resource that does not opt in, which would
    # break Google Fonts and the Firebase SDK from gstatic. It is the right
    # header for a site that self-hosts everything, which this one does not.

    # Permissions policy — disable features the app doesn't use
    # microphone and geolocation are "self", not blocked: voice input and the
    # city lookup are real features. Everything else is denied outright.
    Permissions-Policy = "camera=(), payment=(), usb=(), magnetometer=(), accelerometer=(), microphone=(self), geolocation=(self), interest-cohort=()"

    # Content Security Policy (single line — newlines are invalid in header values)
    # Scripts: self + Firebase CDN + Google APIs (auth). Styles/fonts: Google Fonts.
    # Connect: self (proxy) + Firebase + Nominatim geocoding.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-qXkl6DTYnFyCufvI+DJE3e+tSOWGeeQd0CqVZkeZSrg=' 'sha256-XvVf1/Pt9EXGbDDzyjMbdcK8hGXOBvI9aL4VnoZGY9o=' https://www.gstatic.com https://apis.google.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://identitytoolkit.googleapis.com https://nominatim.openstreetmap.org https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; img-src 'self' data: https:; frame-src https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai-proxy"
  status = 200

# Legacy path kept so any cached client keeps working — council is now the
# single review implementation.
[[redirects]]
  from = "/api/consensus"
  to = "/.netlify/functions/ai-council"
  status = 200

[[redirects]]
  from = "/api/council"
  to = "/.netlify/functions/ai-council"
  status = 200

[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/updates"
  status = 200

[[redirects]]
  from = "/api/unsubscribe"
  to = "/.netlify/functions/updates"
  status = 200

[[redirects]]
  from = "/api/subscribers"
  to = "/.netlify/functions/updates"
  status = 200

[[redirects]]
  from = "/api/broadcast"
  to = "/.netlify/functions/broadcast"
  status = 200
